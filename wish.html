<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly wishlist</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFFF">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFFF;--card:#fff;--ink:#2B1E4F;--ink2:#6B5F8C;--line:#E3DAF7;--pink:#FF4F8B;--pink-deep:#E03A76;--mint:#6FDDBE;--butter:#FFD35A;
  --display:"Baloo 2",ui-rounded,system-ui,sans-serif;--body:ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
.wrap{max-width:900px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.kicker{font-weight:800;color:var(--pink);letter-spacing:.04em;text-transform:uppercase;font-size:13px;margin:0}
h1{font:800 clamp(36px,10vw,56px)/.95 var(--display);margin:4px 0 8px;letter-spacing:-.02em}
.lead{color:var(--ink2);font-weight:600;margin:0 0 20px;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 12px}
.item .ph{position:relative;aspect-ratio:1;border-radius:28px;overflow:hidden;background:#EADFFF}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .ph .mono{position:absolute;inset:0;display:grid;place-items:center;font:800 64px var(--display);color:rgba(43,30,79,.25)}
.item.taken .ph img,.item.taken .ph .mono{filter:grayscale(.8) opacity(.55)}
.badge{position:absolute;left:10px;bottom:10px;right:10px;text-align:center;font-weight:800;font-size:13px;border-radius:12px;padding:6px 8px;background:var(--ink);color:#fff}
.badge.mine{background:var(--mint);color:var(--ink)}
/* the hang tag: a house-shaped card with a coloured border, hung on a ribbon */
.tag{position:absolute;top:-8px;left:12px;z-index:2;transform:rotate(-7deg);transform-origin:50% 0;filter:drop-shadow(0 2px 1px rgba(43,30,79,.18))}
.tag .rib{position:absolute;left:50%;top:-10px;width:5px;height:21px;margin-left:-2.5px;background:#FF4F8B;border-radius:3px;z-index:2}
.tag .tg{position:relative;z-index:1;display:block;background:#4EC1C6;padding:3px;clip-path:polygon(26% 0,74% 0,100% 30%,100% 100%,0 100%,0 30%)}
.tag .tg b{position:relative;display:block;background:#fff;padding:22px 12px 12px;font:800 12px/1 ui-rounded,system-ui,sans-serif;letter-spacing:.05em;color:#2B1E4F;text-align:center;white-space:nowrap;clip-path:polygon(25% 0,75% 0,100% 29%,100% 100%,0 100%,0 29%)}
.tag .tg b::before{content:"";position:absolute;top:6px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#E4E0EC;box-shadow:inset 0 1px 1px rgba(43,30,79,.3)}
.item{position:relative}
.nm{font:700 19px/1.1 var(--display);margin:9px 4px 0}
.meta{font-size:13.5px;color:var(--ink2);font-weight:600;margin:1px 4px 8px}
.note{font-size:14px;margin:0 4px 8px;color:var(--ink)}
.btn{width:100%;height:46px;border-radius:14px;font-weight:800;background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-deep)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.5}
.empty{text-align:center;padding:60px 16px;color:var(--ink2)}
.empty h2{font:800 28px var(--display);color:var(--ink);margin:0 0 6px}
.foot{margin-top:34px;text-align:center;color:var(--ink2);font-size:13.5px}
.scrim{position:fixed;inset:0;background:rgba(43,30,79,.42);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px);max-width:560px;margin:0 auto;transform:translateY(110%);transition:transform .25s}
.sheet.open{transform:none}
.sheet h3{font:800 24px/1.1 var(--display);margin:0 0 6px}
.sheet p{color:var(--ink2);margin:0 0 14px}
.sheet input{width:100%;height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;margin-bottom:12px;background:#fff}
.row{display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">For family and friends</p>
  <h1 id="title">Jelly wishlist</h1>
  <p class="lead" id="lead">Loading the wishlist…</p>
  <div class="grid" id="grid"></div>
  <p class="foot">Reserving a Jelly lets other family see it's taken, so nobody doubles up. Please keep this link for grown-ups so the surprise lasts.</p>
</main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h3 id="sTitle">Getting this one?</h3>
  <p>Add your name so other family know. It's optional.</p>
  <input id="sName" placeholder="e.g. Nanna" maxlength="40" autocomplete="given-name">
  <div class="row"><button class="btn alt" id="sCancel">Cancel</button><button class="btn" id="sGo">Reserve it</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=(location.pathname.match(/\/w\/([A-Za-z0-9]{8,32})/)||[])[1]||new URLSearchParams(location.search).get("id")||"";
const TK="jellystash-wish-tokens-"+id;
const tokens=(()=>{try{return JSON.parse(localStorage.getItem(TK)||"{}")}catch(e){return {}}})();
const saveTokens=()=>{try{localStorage.setItem(TK,JSON.stringify(tokens))}catch(e){}};
const newToken=()=>{const a=new Uint8Array(18);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,"0")).join("")};
let data=null, pending=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
async function load(){
  if(!id){ $("#lead").textContent="This wishlist link isn't complete. Ask for the link again."; return }
  try{
    const r=await fetch("/api/wishlist?id="+encodeURIComponent(id),{cache:"no-store"});
    const j=await r.json();
    if(!j.found){ $("#lead").textContent="This wishlist isn't shared any more."; $("#grid").innerHTML=""; return }
    data=j; render();
  }catch(e){ $("#lead").textContent="Couldn't load the wishlist. Check the connection and try again." }
}
function render(){
  document.title=data.title; $("#title").textContent=data.title;
  const n=data.items.length, taken=data.items.filter(i=>data.reserved[i.id]).length;
  $("#lead").textContent=n?`${n} Jell${n===1?"y":"ies"} on the list${taken?`, ${taken} already reserved`:""}. Tap one you'd like to get.`:"";
  if(!n){ $("#grid").innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>All wishes granted</h2><p>There's nothing on the list right now.</p></div>`; return }
  $("#grid").innerHTML=data.items.map(i=>{
    const r=data.reserved[i.id], mine=r&&tokens[i.id];
    const pic=i.thumb||i.ref;
    const meta=[i.size,i.range&&!(i.name||"").startsWith(i.range)?i.range:""].filter(Boolean).join(", ");
    return `<div class="item${r?" taken":""}">
      ${i.code?`<span class="tag"><i class="rib"></i><span class="tg"><b>${esc(i.code)}</b></span></span>`:""}
      <div class="ph">${pic?`<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer" loading="lazy">`:`<span class="mono">${esc((i.name||"?")[0].toUpperCase())}</span>`}
        ${r?`<span class="badge${mine?" mine":""}">${mine?"You're getting this":(r.by?esc(r.by)+" is getting this":"Someone's getting this")}</span>`:""}</div>
      <div class="nm">${esc(i.name||"A Jelly")}</div>
      ${meta?`<div class="meta">${esc(meta)}</div>`:""}
      ${i.note?`<p class="note">${esc(i.note)}</p>`:""}
      ${mine?`<button class="btn alt" data-undo="${esc(i.id)}">Undo reservation</button>`:(r?"":`<button class="btn" data-res="${esc(i.id)}">I'm getting this one</button>`)}
    </div>`;
  }).join("");
}
$("#grid").onclick=async e=>{
  const res=e.target.closest("[data-res]"), undo=e.target.closest("[data-undo]");
  if(res){ pending=data.items.find(i=>i.id===res.dataset.res); $("#sTitle").textContent=`Getting ${pending.name||"this one"}?`; try{$("#sName").value=localStorage.getItem("jellystash-wish-name")||""}catch(e){} open(true) }
  if(undo){ await act("unreserve",undo.dataset.undo,tokens[undo.dataset.undo]); }
};
function open(on){ $("#scrim").classList.toggle("open",on); $("#sheet").classList.toggle("open",on) }
$("#scrim").onclick=$("#sCancel").onclick=()=>open(false);
$("#sGo").onclick=async()=>{
  const by=$("#sName").value.trim(); try{localStorage.setItem("jellystash-wish-name",by)}catch(e){}
  open(false); const t=newToken(); await act("reserve",pending.id,t,by);
};
async function act(action,itemId,token,by){
  try{
    const r=await fetch("/api/wishlist?id="+encodeURIComponent(id),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,itemId,token,by})});
    const j=await r.json();
    if(!r.ok){ toast(j.error||"That didn't work"); return load() }
    if(action==="reserve"){ tokens[itemId]=token; toast("Reserved. Thank you!") } else { delete tokens[itemId]; toast("Reservation removed") }
    saveTokens(); load();
  }catch(e){ toast("No connection. Try again in a moment.") }
}
load();
</script>
</body>
</html>
